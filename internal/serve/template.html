<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hev_ kit — traces</title>
<!-- Value picker and palette from hev/layer-ui, staged by scripts/import-layer-ui.py. -->
<link rel="stylesheet" href="ui/theme.css">
<link rel="stylesheet" href="ui/list-select.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Fonts must not delay the loading chrome or the first archive request. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<script>
// Theme before first paint: auto follows the system, light and dark pin it.
// data-appearance is the attribute the layer-ui picker styles read.
(function(){ let t='auto'; try { t=localStorage.getItem('kit.theme')||'auto'; } catch(e){}
  const r=document.documentElement; if (t==='auto') r.removeAttribute('data-theme'); else r.dataset.theme=t;
  const dark = t==='dark' || (t==='auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) r.dataset.appearance='dark'; else r.removeAttribute('data-appearance'); })();
</script>
<style>
:root{
  --paper:#fafaf5;--paper-warm:#f4f0e6;--ink:#111;--ink-soft:#2a2a28;--muted:#6b6b66;--muted-2:#9a9a94;
  --signal:#e25822;--signal-dark:#c2451b;--rule:#e8e5dc;--rule-2:#d8d4c8;
  --c-model:#e25822;--c-tool:#2f6fd6;--c-agent:#1aa38c;--c-git:#9b2f8f;--c-idle:#b8b5ab;
  --c-in:#2f6fd6;--c-out:#e25822;--c-cw:#1aa38c;--c-cr:#c9c6bb;
  --danger:#c62828;--warn:#b7791f;--c-user:#6a4fd6;--hl:#ffe27a;
  /* the transcript: white on light, the terminal on dark */
  --term-bg:#ffffff;--term-fg:#1f1f1d;--term-dim:#6b6b66;--term-dim2:#9a9a94;--term-rule:#e8e5dc;
  --term-add:#e4f3e1;--term-del:#fbe5e2;--term-addfg:#1e6b2a;--term-delfg:#a32020;--term-user:#f4f0e6;
  --term-code:#f1eee6;--term-pre:#f7f5ef;--term-status:#f4f0e6;--term-side:#faf8f2;--term-err:#c62828;--term-git:#9b2f8f;--term-band:#111;
  --mono:"JetBrains Mono","JetBrains Mono NL",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  /* layer-ui tokens, mapped onto the palette above */
  --line:var(--rule-2);--panel:#fffefa;--surface:var(--paper-warm);--accent:var(--signal-dark);--on-accent:#fffefa;
  --pale:#f8e9de;--bar:#e9ddd1;--bar-selected:#e6c4ad;--shadow:#11111112;
}
/* dark: from the system unless the switcher says light, or forced by the switcher */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151513;--paper-warm:#1f1f1c;--ink:#ecebe4;--ink-soft:#d5d3ca;--muted:#9c9b93;--muted-2:#6f6e67;
    --rule:#2a2a27;--rule-2:#3a3a36;--c-idle:#4a4a45;--c-cr:#4d4c46;--c-user:#9d86ff;--hl:#6b5518;
    color-scheme:dark;--panel:#1b1b19;--accent:#ff6b33;--on-accent:#111;--pale:#322219;--bar:#433022;--bar-selected:#684028;--shadow:#00000025;
    --term-bg:#1b1b19;--term-fg:#e6e3da;--term-dim:#8a8a83;--term-dim2:#5d5d57;--term-rule:#2c2c29;
    --term-add:#1f3d24;--term-del:#4a2020;--term-addfg:#9ee49a;--term-delfg:#f2a1a1;--term-user:#232320;
    --term-code:#2a2a27;--term-pre:#232320;--term-status:#121210;--term-side:#141412;--term-err:#f2a1a1;--term-git:#d58bcb;--term-band:#fff;
  }
}
:root[data-theme="dark"]{
  --paper:#151513;--paper-warm:#1f1f1c;--ink:#ecebe4;--ink-soft:#d5d3ca;--muted:#9c9b93;--muted-2:#6f6e67;
  --rule:#2a2a27;--rule-2:#3a3a36;--c-idle:#4a4a45;--c-cr:#4d4c46;--c-user:#9d86ff;--hl:#6b5518;
  color-scheme:dark;--panel:#1b1b19;--accent:#ff6b33;--on-accent:#111;--pale:#322219;--bar:#433022;--bar-selected:#684028;--shadow:#00000025;
  --term-bg:#1b1b19;--term-fg:#e6e3da;--term-dim:#8a8a83;--term-dim2:#5d5d57;--term-rule:#2c2c29;
  --term-add:#1f3d24;--term-del:#4a2020;--term-addfg:#9ee49a;--term-delfg:#f2a1a1;--term-user:#232320;
  --term-code:#2a2a27;--term-pre:#232320;--term-status:#121210;--term-side:#141412;--term-err:#f2a1a1;--term-git:#d58bcb;--term-band:#fff;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:var(--mono)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:1px solid var(--rule-2);border-radius:4px;padding:2px 8px;cursor:pointer}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--rule-2);border-radius:4px;padding:3px 6px}
kbd{font-family:var(--mono);font-size:.75em;border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:relative;display:flex;align-items:center;gap:18px;padding:8px 18px;border-bottom:1px solid var(--rule);background:var(--paper);flex:0 0 auto}
.wordmark{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
.wordmark i{color:var(--signal);font-style:normal;animation:blink 1.2s steps(1) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.tabs{display:flex;gap:2px}
.tabs button{border:none;padding:4px 10px;border-radius:4px;color:var(--muted)}
.tabs button.on{background:var(--paper-warm);color:var(--ink)}
.spacer{flex:1}
.range{display:flex;gap:2px;align-items:center;font-size:.85em;color:var(--muted)}
.range button{border:none;padding:3px 9px;border-radius:4px;color:var(--muted)}
.range button.on{background:var(--paper-warm);color:var(--ink)}
.ghmark{display:grid;place-items:center;margin-left:-10px;padding:3px;border-radius:50%;color:var(--muted)}
.ghmark:hover{color:var(--ink)}
.ghmark svg{width:18px;height:18px;fill:currentColor;display:block}
.outlinks{display:flex;gap:4px;align-items:center;padding-left:14px;border-left:1px solid var(--rule)}
.outlinks a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--mono);font-size:.82em;color:var(--ink-soft);border:1px solid var(--rule-2);border-radius:999px;padding:3px 10px 3px 8px}
.outlinks a:hover{color:var(--accent);border-color:var(--accent);background:var(--pale)}
.outlinks a::after{content:"↗";color:var(--muted-2);font-size:.9em}
.outlinks a:hover::after{color:var(--accent)}
.outlinks svg{width:14px;height:14px;fill:currentColor}
.outlinks svg.stroke{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.themebtn{border:none;border-radius:4px;padding:4px;color:var(--muted);display:grid;place-items:center}
.themebtn:hover{background:var(--paper-warm);color:var(--ink)}
.themebtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.themebtn .moon{display:none}
:root[data-appearance=dark] .themebtn .sun{display:none}
:root[data-appearance=dark] .themebtn .moon{display:block}

/* session header (drill-down) */
.shead{padding:10px 18px 0;border-bottom:1px solid var(--rule);flex:0 0 auto}
.shead .crumb{font-size:.85em;color:var(--muted);margin-bottom:2px}
.shead .crumb a{text-decoration:none}
.shead .crumb a:hover{color:var(--signal)}
.shead h1{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
.shead .meta{color:var(--muted);font-size:.85em;font-family:var(--mono);display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 8px}
.shead .meta b{color:var(--ink);font-weight:500}
.shead .meta a{text-decoration:none}
.shead .meta a:hover{color:var(--signal)}
.subnav{display:flex;gap:2px}
.subnav button{border:none;border-bottom:2px solid transparent;border-radius:0;padding:4px 10px 6px;color:var(--muted)}
.subnav button.on{background:none;color:var(--ink);border-bottom-color:var(--signal)}
.pill{display:inline-block;border:1px solid var(--rule-2);border-radius:999px;padding:0 8px;font-size:.78em;font-family:var(--mono);color:var(--muted);white-space:nowrap}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0}
.view.on{display:flex}

/* ---------- traces ---------- */
#v-traces{flex-direction:column;overflow:auto;padding:18px}
.findbox{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:4px 4px 4px 12px}
.findbox:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.findbox>span{font-size:20px;line-height:1;color:var(--signal)}
.findbox input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font:inherit;font-family:var(--mono);font-size:.95em;padding:6px 4px}
.primary-button{background:var(--accent);border:1px solid var(--accent);color:var(--on-accent);border-radius:5px;padding:5px 14px;font-size:.85em}
.filters{display:flex;flex-direction:column;gap:10px;font-size:.85em;color:var(--muted)}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live-filter{display:flex;align-items:baseline;gap:8px;max-width:100%;padding:4px 10px;border-radius:6px;background:var(--panel);color:var(--ink);text-align:left}
.live-filter span{font-family:var(--mono);font-size:.95em}
.live-filter small{color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-filter[data-active=true]{border-color:var(--accent)}
.live-filter[data-active=true] small{color:var(--ink)}
.live-filter[aria-expanded=true]{background:var(--pale)}
.filter-clear{border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 6px}
.filter-clear:hover{color:var(--ink)}
.chip-sep{width:1px;align-self:stretch;margin:2px 4px;background:var(--rule-2)}
.live-filter.toggle{align-items:center}
.live-filter.toggle .check{width:13px;height:13px;border:1px solid var(--rule-2);border-radius:3px;display:inline-grid;place-items:center;font-style:normal;font-size:10px;line-height:1}
.live-filter.toggle[aria-pressed=true]{background:var(--pale)}
.live-filter.toggle[aria-pressed=true] .check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.live-filter.toggle[aria-pressed=true] .check::after{content:"✓"}
.filter-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.filter-cards[hidden]{display:none}
.filter-card{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px 16px;min-width:0}
.filter-card .editor-close{position:absolute;top:8px;right:10px;border:0;font-size:18px;line-height:1;color:var(--muted);padding:4px}
.filter-card .editor-close:hover{color:var(--ink)}
.filter-card .vs-label{padding-right:28px}
.filter-card .vs-label label{font-family:var(--mono);color:var(--ink)}
.range-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range-inputs label{display:flex;flex-direction:column;gap:4px;font-size:.9em;color:var(--muted)}
.range-inputs input{font:inherit;font-family:var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.range-inputs input:focus{outline:2px solid var(--accent);outline-offset:1px}
.range-note{font-size:.85em;color:var(--muted);margin-top:8px}
/* layer-ui scopes these to its workbench specimen */
.vs-input-wrap input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font:inherit;padding:9px 0}
/* layer-ui assumes unstyled buttons; :where keeps its own class rules in charge */
:where(.value-select) button{border:0;border-radius:0;padding:0;background:none}
.value-select{font-size:14px}
.filters .chip{border:1px solid var(--rule-2);border-radius:999px;padding:1px 10px;cursor:pointer;color:var(--ink);background:var(--paper-warm)}
.filters .chip b{font-weight:500;color:var(--muted);margin-left:6px}
table.grid{border-collapse:collapse;width:100%;font-size:.88em}
table.grid th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--rule-2);padding:6px 8px;white-space:nowrap;user-select:none}
table.grid th.sortable{cursor:pointer}
table.grid th.sortable:hover{color:var(--ink)}
table.grid th.sorted{color:var(--ink)}
table.grid th.sorted::after{content:" ↓";color:var(--signal)}
table.grid th.sorted.asc::after{content:" ↑"}
#v-traces table.grid th{position:sticky;top:-18px;background:var(--paper);z-index:1}
table.grid td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.grid td.nw{white-space:nowrap}
table.grid td.num,table.grid th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.grid tr.row{cursor:pointer}
table.grid tr.row:hover td{background:var(--paper-warm)}
table.grid tr.cur td{background:var(--paper-warm)}
table.grid tr.row.hover td{background:var(--paper-warm)}
table.grid tr.has-snip td{border-bottom:0;padding-bottom:2px}
table.grid tr.snip td{padding-top:0;padding-bottom:10px}
.snippet{--k:var(--muted);display:block;text-decoration:none;max-width:1100px;margin:0 0 0 2px;padding:6px 12px 7px;border-left:3px solid var(--k);border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--k) 7%,var(--paper))}
table.grid tr.snip:hover .snippet,table.grid tr.snip.hover .snippet{background:color-mix(in srgb,var(--k) 13%,var(--paper))}
.snippet .src{display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:.76em;color:var(--muted);margin-bottom:2px}
.snippet .src b{color:var(--k);font-weight:600}
.snippet .src time{margin-left:auto;color:var(--muted-2)}
.snippet .txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;font-size:.95em;line-height:1.55;color:var(--ink)}
.snippet.k-tool .txt{font-family:var(--mono);font-size:.84em;line-height:1.6;color:var(--ink-soft)}
.snippet.k-think .txt{font-style:italic;color:var(--ink-soft)}
.snippet mark{background:var(--hl);color:var(--ink);border-radius:2px;padding:0 2px;font-weight:600;box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
.k-user{--k:var(--c-user)}.k-model{--k:var(--c-model)}.k-think{--k:var(--c-model)}.snippet.k-think{border-left-style:dashed;background:var(--paper-warm)}.hit-legend .k-think i{background:none;border:1.5px dashed var(--k)}.k-tool{--k:var(--c-tool)}.k-agent{--k:var(--c-agent)}.k-eval{--k:var(--warn)}
.hit-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8em;color:var(--muted);padding:0 0 8px 8px}
.hit-legend span{display:inline-flex;align-items:center;gap:5px}
.hit-legend i{width:9px;height:9px;border-radius:2px;background:var(--k)}
table.grid .sub{color:var(--muted);font-size:.9em;display:block;max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.grid a.repo{text-decoration:none;font-family:var(--mono);font-size:.85em}
table.grid a.repo:hover{color:var(--signal)}
table.grid a.repo .br,table.grid span.repo .br{color:var(--muted)}
table.grid span.repo{font-family:var(--mono);font-size:.85em}
table.grid .bf{color:var(--muted-2);font-size:.75em;margin-left:6px;border:1px dashed var(--rule-2);border-radius:999px;padding:0 6px;white-space:nowrap}
.hits{margin:0 0 14px;border:1px solid var(--rule);border-radius:6px;padding:10px 14px;background:var(--paper-warm)}
.hits h3{font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:600}
.hit{padding:6px 0;border-top:1px solid var(--rule);cursor:pointer}
.hit:first-of-type{border-top:none}
.hit .h{font-family:var(--mono);font-size:.8em;color:var(--muted)}
.hit .h b{color:var(--ink);font-weight:500}
.hit .t{font-size:.9em}
.hit mark{background:rgba(226,88,34,.25);color:inherit}
.legend-note{color:var(--muted);font-size:.8em;margin-top:8px}

/* ---------- transcript (terminal) ---------- */
#v-transcript{position:relative}
.term{flex:1;min-width:0;overflow:auto;background:var(--term-bg);color:var(--term-fg);font-family:var(--mono);font-size:13px;line-height:1.5;padding:18px 40px 80px 18px;scroll-behavior:smooth}
.term .turn{margin:0 0 14px;padding-left:22px;position:relative;scroll-margin-top:16px}
.term .turn.hl{outline:1px solid var(--signal);outline-offset:8px;border-radius:2px}
.term .prompt{background:var(--term-user);border-left:2px solid var(--term-dim2);padding:6px 10px;margin:0 0 8px -22px;white-space:pre-wrap;word-break:break-word;color:var(--term-fg)}
.term .prompt::before{content:"> ";color:var(--term-dim)}
.term .prompt .ts{float:right;color:var(--term-dim2);font-size:.85em}
.term .asst{white-space:pre-wrap;word-break:break-word;margin:4px 0 8px;position:relative}
.term .asst::before,.term .tool .call::before{content:"⏺";position:absolute;left:-18px;color:var(--term-fg)}
.term .tool .call.err::before{color:var(--term-err)}
.term .tool .call.ag::before{color:var(--c-agent)}
.term .asst code{background:var(--term-code);padding:0 3px;border-radius:2px}
.term .asst pre{background:var(--term-pre);padding:6px 8px;border-radius:3px;margin:4px 0;overflow:auto}
.term .asst h1,.term .asst h2,.term .asst h3{font-size:1em;font-weight:600;margin:6px 0 2px}
.term .asst ul{padding-left:18px}
.term .asst table.mdt{border-collapse:collapse;margin:6px 0;white-space:normal;font-size:.95em}
.term .asst table.mdt th{text-align:left;font-weight:600;border-bottom:1px solid var(--term-dim2);padding:2px 12px 2px 0;color:var(--term-fg)}
.term .asst table.mdt td{padding:2px 12px 2px 0;border-bottom:1px solid var(--term-rule);vertical-align:top;color:var(--term-fg)}
.term .asst table.mdt td.n,.term .asst table.mdt th.n{text-align:right;font-variant-numeric:tabular-nums}
.term .tool{position:relative;margin:2px 0 6px}
.term .tool .call{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .tool .call b{font-weight:600}
.term .tool .call .dur{color:var(--term-dim2);margin-left:8px;font-size:.9em}
.term .tool .res{color:var(--term-dim);white-space:pre-wrap;word-break:break-word;padding-left:14px;position:relative}
.term .tool .res::before{content:"⎿";position:absolute;left:0;color:var(--term-dim2)}
.term .tool .res .more{color:var(--term-dim2);cursor:pointer}
.term .tool .res .more:hover{color:var(--term-fg)}
.term .tool .res.err{color:var(--term-err)}
.term .think{margin:2px 0 6px;color:var(--term-dim)}
.term .think summary{cursor:pointer;list-style:none;color:var(--term-dim2)}
.term .think summary::before{content:"✻ ";color:var(--term-dim2)}
.term .think .body{white-space:pre-wrap;word-break:break-word;padding:4px 0 4px 14px;font-style:italic;color:var(--term-dim)}
.term .idle{color:var(--term-dim2);text-align:center;margin:10px 0;font-size:.9em}
.term .idle::before,.term .idle::after{content:" ── ";}
.term .ev{color:var(--term-dim2);margin:6px 0;font-size:.9em}
.term .ev.compact{border-top:1px dashed var(--term-dim2);padding-top:4px}
.term .diff{padding-left:14px;white-space:pre;overflow:auto;font-size:.95em}
.term .diff .a{background:var(--term-add);color:var(--term-addfg)}
.term .diff .d{background:var(--term-del);color:var(--term-delfg)}
.term .diff .c{color:var(--term-dim)}
.term .nest{border-left:1px solid var(--term-rule);margin:4px 0 8px 4px;padding-left:22px;display:none}
.term .nest.open{display:block}
.term .agentdone{color:var(--term-dim);padding-left:14px;position:relative;cursor:pointer}
.term .agentdone::before{content:"⎿";position:absolute;left:0;color:var(--term-dim2)}
.term .agentdone:hover{color:var(--term-fg)}
.term .turnmeta{color:var(--term-dim2);font-size:.85em;margin-top:6px;display:flex;gap:14px}

.spine svg text.ev{fill:var(--term-dim)}
.spine svg text.ev.err{fill:var(--term-err)}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.8em;padding:6px 9px;border-radius:5px;max-width:360px;display:none;font-family:var(--mono);line-height:1.4;white-space:pre-wrap}

<script>
(async function(){
const DATA = /*__DATA__*/null;
const S = DATA.session;
S.turns=S.turns||[]; S.agents=S.agents||[]; S.requests=S.requests||[]; S.commits=S.commits||[]; S.serial_reads=S.serial_reads||[]; S.tool_table=S.tool_table||[]; S.model_table=S.model_table||[]; S.usage=S.usage||{}; S.agent_usage=S.agent_usage||{};
for (const t of S.turns){ t.items=t.items||[]; t.usage=t.usage||{}; }
for (const a of S.agents){ a.items=a.items||[]; a.tools=a.tools||[]; a.requests=a.requests||[]; a.usage=a.usage||{}; }
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (k==='class') e.className=v; else if (k==='html') e.innerHTML=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k,v);} for (const k of kids) e.append(k); return e; };
const esc = s => String(s??'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtN = n => Math.round(n).toLocaleString('en-US');
const fmtMs = ms => { if (ms==null) return '–'; if (ms<1000) return Math.round(ms)+'ms'; const s=Math.round(ms/1000); if (s<60) return s+'s'; const m=Math.floor(s/60); if (m<60) return m+'m '+(s%60)+'s'; const h=Math.floor(m/60); if (h<48) return h+'h '+(m%60)+'m'; return Math.floor(h/24)+'d '+(h%24)+'h'; };
const fmtTok = n => n>=1e9? (n/1e9).toFixed(1).replace(/\.0$/,'')+'B' : n>=1e6? (n/1e6).toFixed(n>=1e8?0:1).replace(/\.0$/,'')+'M' : n>=1e3 ? (n/1e3).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+'k' : fmtN(n);
const fmtUsd = n => '$'+n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtClock = t => new Date(t).toLocaleTimeString([], {hour12:false});
const fmtDate = t => new Date(t).toLocaleDateString([], {month:'short', day:'numeric'})+' '+new Date(t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false});
const ago = t => { const d=Date.now()-t; const h=d/36e5; if (h<1) return Math.round(d/6e4)+'m ago'; if (h<48) return Math.round(h)+'h ago'; return Math.round(h/24)+'d ago'; };
const usageTotal = u => (u.input||0)+(u.output||0)+(u.cache_write||0)+(u.cache_read||0);
const cacheHit = u => { const d=(u.input||0)+(u.cache_read||0)+(u.cache_write||0); return d? (u.cache_read||0)/d : 0; };
const shortModel = m => (m||'').replace(/^claude-/,'').replace(/\[1m\]$/,'');
const tip = $('#tip');
function showTip(e, text){ tip.textContent=text; tip.style.display='block'; moveTip(e); }
function moveTip(e){ const x=e.clientX+14, y=e.clientY+14; tip.style.left=Math.min(x, innerWidth-380)+'px'; tip.style.top=Math.min(y, innerHeight-tip.offsetHeight-10)+'px'; }
function hideTip(){ tip.style.display='none'; }
function toast(t){ const x=$('#toast'); x.textContent=t; x.style.display='block'; clearTimeout(x._t); x._t=setTimeout(()=>x.style.display='none', 2600); }
const CTX_WINDOW = 1e6;

// ---------------------------------------------------------------- window (timeframe)
const WINDOWS=[['7d',7],['30d',30],['90d',90],['all',0]];
const params = new URLSearchParams(location.search);
let windowDays = WINDOWS.find(([key])=>key===(params.get('window')||'30d'))?.[1] ?? 30;
let searchRows = null, refreshID = 0, archivePending = false;
let built={}; let currentView='v-stats';
const DRILL = new Set(['transcript','timeline','sstats']);
// Held by reference: views rebuild with innerHTML='', which detaches it until placeStatus puts it back.
const statusLine = $('#archive-status');
function corpusInWindow(){ return DATA.corpus; }
function saveFilters(){ history.pushState(null,'','?'+params.toString()+location.hash); }
let customOpen=params.has('since')||params.has('until');
function dateValue(key){
 const raw=params.get(key);if(!raw)return '';
 const d=new Date(/^\d+$/.test(raw)?Number(raw):raw);if(!Number.isFinite(+d))return '';
 if(key==='until')d.setUTCDate(d.getUTCDate()-1);
 return d.toISOString().slice(0,10);
}
function rangeBar(){
 const r=$('#range');r.replaceChildren(el('span',{},'window'));
 const custom=params.has('since')||params.has('until');
 for(const [l,d] of WINDOWS)r.append(el('button',{class:!custom&&d===windowDays?'on':'',onclick:()=>{
  windowDays=d;customOpen=false;params.set('window',l);params.delete('since');params.delete('until');saveFilters();rangeBar();refreshArchive();
 }},l));
 const label=day=>new Date(day+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
 const since=dateValue('since'),until=dateValue('until');
 r.append(el('button',{class:custom?'on':'','aria-expanded':String(customOpen),onclick:()=>{customOpen=!customOpen;rangeBar();}},since&&until?label(since)+' – '+label(until):'custom'));
 if(customOpen){
  const form=el('div',{class:'custom-dates'});
  const a=el('input',{type:'date','aria-label':'since',value:since}),b=el('input',{type:'date','aria-label':'until',value:until});
  const change=()=>{
   b.setCustomValidity(a.value&&b.value&&a.value>b.value?'End date must be on or after start date.':'');
   if(!a.value||!b.value||!b.reportValidity())return;
   params.set('window','all');windowDays=0;params.set('since',a.value);
   const end=new Date(b.value+'T00:00:00Z');end.setUTCDate(end.getUTCDate()+1);params.set('until',end.toISOString());
   saveFilters();rangeBar();refreshArchive();
  };
  a.addEventListener('change',change);b.addEventListener('change',change);
  form.append(el('label',{},'From ',a),el('label',{},'Through ',b));r.append(form);
 }
}
function timingLabel(t){return t ? `Layer ${(t.layer_ms/1000).toFixed(1)} s, ${t.queries} ${t.queries===1?'query':'queries'}` : '';}
function setLoading(on, err){
 document.body.classList.toggle('loading',on);
 const status=statusLine;
 document.querySelectorAll('.grid').forEach(t=>t.setAttribute('aria-busy',String(on)));
 const rows=searchRows??DATA.corpus;
 // Stats and the trace header carry their own count and timing; the line only speaks there while loading or failing.
 status.hidden=!on&&!err&&(currentView==='v-stats'||DRILL.has(currentView.slice(2)));
 status.textContent=on?'Loading…':err?err:`${fmtN(rows.length)} traces · ${fmtUsd(rows.reduce((a,r)=>a+r.cost,0))} · ${timingLabel(DATA.listTiming)}`;
}
// The status line sits next to what it describes: above the table, atop stats, in the trace header.
function placeStatus(){
 const status=statusLine,name=currentView.slice(2);
 if(DRILL.has(name))$('#shead').append(status);
 else if(name==='traces')$('#v-traces').prepend(status);
 else if(name==='stats')$('#v-stats').prepend(status);
}
async function getJSON(url){
 const r=await fetch(url);const data=await r.json();if(!r.ok)throw Error(data.error||r.statusText);return data;
}
async function refreshArchive(view){
 hidePreview();const id=++refreshID;archivePending=true;setLoading(true);
 // Picker counts come from the server's in-memory archive; fetch them for every
 // facet now so opening one never waits.
 warmValues();syncCards();
 const query=new URLSearchParams(params);for(const k of ['session','q'])query.delete(k);
 query.set('timezone',Intl.DateTimeFormat().resolvedOptions().timeZone);
 const searchQuery=new URLSearchParams(query);searchQuery.set('q',params.get('q')||'');
 try {
  const list=await getJSON('/api/sessions?'+query);
  if(id!==refreshID)return;
  DATA.corpus=list.sessions;DATA.stats=null;DATA.facets=list.facets;DATA.listTiming=list.timing;searchRows=null;
  if(params.get('q')){
   const hits=await getJSON('/api/search?'+searchQuery);if(id!==refreshID)return;
   searchRows=hits.sessions;DATA.listTiming=hits.timing;
  }
  built.stats=false;built.traces=false;renderFilterBar();show(view||currentView.slice(2));
  setLoading(false);
  if(currentView==='v-stats')await refreshStats(query,id);
 } catch(e){if(id===refreshID)setLoading(false,'Could not load traces: '+e.message);}
 finally{if(id===refreshID)archivePending=false;}
}
async function refreshStats(query,id){
 setLoading(true);
 try {
  const stats=await getJSON('/api/stats?'+query);if(id!==refreshID)return;
  DATA.stats=stats;built.stats=false;if(currentView==='v-stats')show('stats');setLoading(false);
 } catch(e){if(id===refreshID)setLoading(false,'Could not load stats: '+e.message);}
}

// Filters follow layer-ui's search app: every field is a chip, and clicking one
// opens it as a card. Cards sit side by side across the full width, so a query
// is built from several at once. Picker counts come from /api/values, scoped by
// the other filters, and are fetched in the background before any card opens.
const FACETS=['project','model','tool','harness','host'];
const RANGES={

// Search snippets: plain text centred on the densest run of query terms, with
// every term marked and a label for where in the trace the match sits.
const STOP=new Set('a an and are as at be by for from how in into is it its of on or that the this to was what when why with'.split(' '));
function queryTerms(q){return [...new Set(q.toLowerCase().match(/[\p{L}\p{N}_$@#./-]+/gu)||[])].map(t=>t.replace(/^[./-]+|[./-]+$/g,'')).filter(t=>t.length>1&&!STOP.has(t)).sort((a,b)=>b.length-a.length);}
function plainText(s){
 // Tool inputs and some harness messages are indexed as JSON-escaped strings.
 let t=String(s||'').replace(/\\u([0-9a-fA-F]{4})/g,(_,h)=>String.fromCharCode(parseInt(h,16))).replace(/\\+[nrt]/g,' ').replace(/\\+(["'\\])/g,'$1');
 if(/^\s*[\[{]/.test(t))t=t.replace(/[{}\[\]"]+/g,' ').replace(/\s*,\s*/g,', ');
 return t.replace(/```[\w-]*/g,' ').replace(/^\s{0,3}#{1,6}\s+/gm,'').replace(/^\s*(?:[-*+]|\d+\.)\s+/gm,'· ').replace(/\*\*|__|`/g,'').replace(/\s+/g,' ').trim();
}
const SNIP=300;
function snippetHTML(text,q){
 const t=plainText(text),low=t.toLowerCase(),terms=queryTerms(q);
 const hits=[];for(const term of terms){let i=-1;while((i=low.indexOf(term,i+1))>=0)hits.push([i,term]);}
 hits.sort((a,b)=>a[0]-b[0]);
 // The window that covers the most distinct terms, then the most matches.
 let best=0,score=[-1,-1];
 for(let a=0;a<hits.length;a++){
  const seen=new Set();let n=0;
  for(let b=a;b<hits.length&&hits[b][0]-hits[a][0]<SNIP-40;b++){seen.add(hits[b][1]);n++;}
  if(seen.size>score[0]||(seen.size===score[0]&&n>score[1])){score=[seen.size,n];best=hits[a][0];}
 }
 // Lead in with context: back to a sentence start if one is close, else a word.
 let start=Math.max(0,best-70);
 if(start>0){const s=t.slice(start,best).search(/[.!?·]\s+\S[^.!?·]*$/),sp=t.indexOf(' ',start);start=s>=0?start+s+2:sp>=0&&sp<best?sp+1:start;}
 let end=Math.min(t.length,start+SNIP);if(end<t.length){const sp=t.lastIndexOf(' ',end);if(sp>start+SNIP/2)end=sp;}
 let h=esc(t.slice(start,end));
 if(terms.length)h=h.replace(new RegExp(terms.map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'gi'),m=>'<mark>'+m+'</mark>');
 return (start>0||/^[a-z]/.test(t)?'…':'')+h+(end<t.length?'…':'');
}
// Who a hit came from, coloured like the timeline: model orange, tools blue,

function hitKind(r){

 if(r.block_type==='tool_result')return {kind:'tool',label:tool||'Tool',detail:'output'};
 if(r.sidechain)return {kind:'agent',label:'Subagent',detail:r.block_type==='thinking'?'thinking':''};

function snippet(text, q){ const t=String(text).replace(/\s+/g,' '); const i=t.toLowerCase().indexOf(q); const s=Math.max(0,i-90); return esc(t.slice(s, s+260)).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), m=>'<mark>'+m+'</mark>'); }
function findInSession(q){
  const out=[];
  S.turns.forEach((t, ti)=>{
    if (t.prompt.toLowerCase().includes(q)) out.push({turn:t.uuid, turnIndex:ti, ts:t.ts, role:'user', type:'prompt', text:t.prompt});
    for (const it of t.items){
      if (it.kind==='request') for (const b of it.blocks){ if ((b.text||'').toLowerCase().includes(q)) out.push({turn:t.uuid, turnIndex:ti, ts:b.ts, role:'assistant', type:b.type, text:b.text}); }
      if (it.kind==='tool'){ const s=(it.summary+' '+JSON.stringify(it.input)).toLowerCase(); if (s.includes(q)) out.push({turn:t.uuid, turnIndex:ti, ts:it.start, role:'assistant', type:'tool_use', tool:it.name, text:it.summary+' '+JSON.stringify(it.input)}); else if ((it.result||'').toLowerCase().includes(q)) out.push({turn:t.uuid, turnIndex:ti, ts:it.end, role:'user', type:'tool_result', tool:it.name, text:it.result}); }
    }
  });
  return out;
}

function md(s){

function renderTool(it, nested){

  wrap.append(call);
  if (isAgent && it.agent && agentIndex[it.agent]){
    const a = agentIndex[it.agent];
    const done = el('div',{class:'agentdone'}, `Done (${fmtN(a.n_tools)} tool uses · ${fmtTok(usageTotal(a.usage))} tokens · ${fmtMs(a.ms)} · ${esc(a.model||'')})  ▸ open transcript`);

  if (res){
    const lines = res.split('\n');
    const r = el('div',{class:'res'+(it.error?' err':'')});
    const shown = lines.slice(0,3).join('\n');
    const collapsed = ()=> esc(shown) + (lines.length>3 ? `\n<span class="more">… +${fmtN(lines.length-3)} lines (click to expand)</span>` : '');

}
function renderItems(items, into, nested){

        if (b.type==='text' && b.text.trim()) into.append(el('div',{class:'asst', id:'x-'+b.uuid, html: md(b.text)}));
        else if (b.type==='thinking' && b.text.trim()){
          const d = el('details',{class:'think'}); d.append(el('summary',{}, `Thought for ${fmtMs(it.ttft)}${it.usage.thinking?` (${fmtTok(it.usage.thinking)} tokens)`:''}`), el('div',{class:'body'}, b.text)); into.append(d);
        } else if (b.type==='tool_use'){ const t = toolIndex[b.tool] || items.find(x=>x.kind==='tool'&&x.id===b.tool); if (t) into.append(renderTool(t, nested)); }

function transcriptView(){

    if (i>0 && t.idle_ms>1500) term.append(el('div',{class:'idle'}, `${fmtMs(t.idle_ms)} idle · waiting on you`));
    const sec = el('section',{class:'turn', id:'t-'+t.uuid});
    if (t.prompt){ const p = el('div',{class:'prompt'}); p.append(el('span',{class:'ts'}, fmtClock(t.ts)), t.prompt); sec.append(p); }

    meta.append(el('a',{href:'#t-'+t.uuid, onclick:(e)=>{e.preventDefault(); navigator.clipboard?.writeText(location.href.split('#')[0]+'#t-'+t.uuid); toast('link to turn '+(i+1)+' copied');}}, '¶ link'));
    meta.append(el('a',{href:'#', onclick:(e)=>{e.preventDefault(); show('timeline'); zoomTo(t.ts, t.end);}}, '⟶ timeline'));

// Hiding tool calls folds each run of consecutive calls into one line: how many,
// which tools, how long, and whether any failed. Clicking the line opens the run.
let hideTools=false; try { hideTools = localStorage.getItem('kit.tools')==='hide'; } catch(e){}
function groupToolRuns(term){
  for (const sec of term.querySelectorAll(':scope > .turn')){
    let run=[];
    const flush=()=>{
      if (!run.length) return;
      const its=run.map(n=>toolIndex[n.id.slice(2)]).filter(Boolean);
      const byName={}; for (const it of its) byName[it.name]=(byName[it.name]||0)+1;
      const ms=its.reduce((a,it)=>a+(it.ms||0),0), failed=its.filter(it=>it.error).length;
      const line=el('div',{class:'toolrun', title:'show these tool calls'});
      line.append(`${run.length} tool call${run.length>1?'s':''} · `+Object.entries(byName).sort((a,b)=>b[1]-a[1]).map(([k,v])=>v>1?k+' ×'+v:k).join(', ')+' · '+fmtMs(ms));
      if (failed) line.append(' · ', el('span',{class:'fail'}, failed+' failed'));
      const members=run; line.addEventListener('click', ()=>{ const open=line.classList.toggle('open'); for (const m of members) m.classList.toggle('shown', open); });
      run[0].before(line); run=[];
    };
    for (const n of [...sec.children]){ if (n.classList.contains('tool')) run.push(n); else if (!n.classList.contains('think')) flush(); }
    flush();
  }
}
function toggleTools(){
  hideTools=!hideTools; try { localStorage.setItem('kit.tools', hideTools?'hide':'show'); } catch(e){}
  const term=$('#term'); const keep=timeAtY(term.scrollTop);
  term.classList.toggle('notools', hideTools); const opt=term.querySelector('.keys .opt'); if (opt){ opt.setAttribute('aria-pressed', String(hideTools)); opt.textContent = hideTools?'show tool calls':'hide tool calls'; }
  anchors=null; term.style.scrollBehavior='auto'; term.scrollTop=yAtTime(keep); term.style.scrollBehavior=''; updateBand();
}
// Scroll the transcript to an element, opening its folded tool run first.
function scrollToEl(n, pad=60){
  const term=$('#term'); const tool=n.closest('.tool');
  if (tool && term.classList.contains('notools') && !tool.classList.contains('shown')){ let p=tool.previousElementSibling; while (p && !p.classList.contains('toolrun')) p=p.previousElementSibling; p?.click(); anchors=null; }
  term.scrollTop = yIn(term, n) - pad;

// ---------------------------------------------------------------- spine (transcript side view)
// The whole trace, top to bottom in time, beside the transcript: the same lanes
// as the timeline, prompts labelled, and a band for the slice of time on screen.
// The transcript is in time order, so scroll position and time map onto each
// other through anchors: every turn, reply and tool call with its timestamp.
let anchors=null, spineMini=false, spineBand=null, spineY=null;

function yIn(term, n){ return n.getBoundingClientRect().top - term.getBoundingClientRect().top + term.scrollTop; }
function buildAnchors(){

  for (const t of S.turns){
    const sec=document.getElementById('t-'+t.uuid); if (!sec) continue;
    push(sec, t.ts);
    for (const it of t.items){
      if (it.kind==='tool') push(document.getElementById('x-'+it.id), it.start);
      else if (it.kind==='request') for (const b of it.blocks) if (b.uuid) push(document.getElementById('x-'+b.uuid), b.ts||it.start);

function timeAtY(y){

function yAtTime(t){

  for (let i=1;i<A.length;i++) if (t<=A[i].t){ const a=A[i-1], b=A[i]; return b.t===a.t ? a.y : a.y+(b.y-a.y)*(t-a.t)/(b.t-a.t); }

function initSpine(){

  const toTime = e=>{ const r=sp.querySelector('svg').getBoundingClientRect(); return spineY.inv(e.clientY-r.top); };
  const scrub = e=>{ term.scrollTop = yAtTime(toTime(e)) - term.clientHeight*0.35; };
  let dragging=false;
  sp.addEventListener('mousedown', e=>{ if (e.target.closest('.tog')) return; e.preventDefault(); dragging=true; term.style.scrollBehavior='auto'; scrub(e); });
  addEventListener('mousemove', e=>{ if (dragging) scrub(e); });
  addEventListener('mouseup', ()=>{ if (dragging){ dragging=false; term.style.scrollBehavior=''; } });
  sp.addEventListener('mousemove', e=>{ if (!spineY || dragging) return; const r=sp.querySelector('svg').getBoundingClientRect(); const h=sp.querySelector('.hover'); if (h){ const y=e.clientY-r.top; h.setAttribute('y1',y); h.setAttribute('y2',y); h.style.display=''; } });

}
function toggleSpine(){ spineMini=!spineMini; try { localStorage.setItem('kit.spine', spineMini?'mini':'full'); } catch(e){} drawSpine(); }
function drawSpine(){
  const sp=$('#spine'); if (!sp) return;
  sp.classList.toggle('mini', spineMini); sp.innerHTML='';
  const tog=el('button',{class:'tog', title:spineMini?'widen (m)':'narrow (m)', onclick:toggleSpine}, spineMini?'‹':'›');
  const W=sp.clientWidth, H=Math.max(100, sp.clientHeight);
  const ns='http://www.w3.org/2000/svg'; const mk=(t,a)=>{const e=document.createElementNS(ns,t); for(const[k,v] of Object.entries(a)) e.setAttribute(k,v); return e;};
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:'none'});
  const top=spineMini?22:26, bot=8, c0=ct(T0), c1=Math.max(c0+1, ct(T1));
  const y=t=>top+(ct(t)-c0)/(c1-c0)*(H-top-bot);

    for (const t of S.turns) if (t.prompt) svg.append(mk('rect',{x:3,y:y(t.ts)-1,width:W-6,height:2,fill:'var(--signal)'}));
    for (const c of S.commits) svg.append(mk('rect',{x:3,y:y(c.ts)-1,width:W-6,height:3,fill:'var(--c-git)'}));
    for (const b of BARS) if (b.err) svg.append(mk('rect',{x:W-6,y:y(b.s),width:3,height:2,fill:'var(--danger)'}));
  } else {
    // columns: clock | you model tools sub git | context | prompt labels
    const col={you:[40,8], model:[51,14], tools:[68,14], agent:[85,12], git:[100,8]}, cx0=112, cw=24, lx=142;
    for (const [k,[x,w]] of Object.entries(col)){ const t=mk('text',{x:x+w/2,y:12,'text-anchor':'middle',class:'hd'}); t.textContent={you:'you',model:'mdl',tools:'tool',agent:'sub',git:'git'}[k][0]; tipped(t,{you:'waiting on you',model:'model requests',tools:'tool calls, main thread',agent:'subagents',git:'commits'}[k]); svg.append(t); }
    const hc=mk('text',{x:cx0+cw/2,y:12,'text-anchor':'middle',class:'hd'}); hc.textContent='ctx'; svg.append(hc);
    const hp=mk('text',{x:lx,y:12,class:'hd'}); hp.textContent='events'; svg.append(hp);
    svg.append(mk('line',{x1:0,x2:W,y1:18,y2:18,class:'sgrid'}));
    // clock ticks, skipping the inside of a compressed wait

      const a=y(b.s), h=Math.max(1, y(b.e)-a);

      svg.append(tipped(r, tipFor(b)));
    }
    for (const c of S.commits){ const py=y(c.ts), [x,w]=col.git, m=x+w/2; svg.append(tipped(mk('path',{d:`M${m} ${py-4}L${m+4} ${py}L${m} ${py+4}L${m-4} ${py}Z`, fill:'var(--c-git)'}), `commit ${c.sha}${c.repo?' · '+c.repo:''}\n${c.msg||''}\n${fmtClock(c.ts)}`)); }

    const maxc=Math.max(1,...S.requests.map(r=>r.context||0));

    for (const c of S.commits) evs.push({p:1, t:c.ts, cls:'ev git', text:'◆ '+(c.msg||c.sha||'commit'), tip:`commit ${c.sha}${c.repo?' · '+c.repo:''}\n${c.msg||''}`});

    const placed=[], room=Math.floor((W-lx-6)/6.1);

      const py=y(e.t); if (py<top-2 || placed.some(q=>Math.abs(q-py)<12)) continue; placed.push(py);

      const tx=tipped(mk('text',{x:lx,y:py+3,class:e.cls}), e.tip); tx.textContent=e.text.replace(/\s+/g,' ').trim().slice(0,room); svg.append(tx);

  }
  spineBand=mk('rect',{x:0,y:0,width:W,height:0,class:'band'}); svg.append(spineBand);
  svg.append(mk('line',{x1:0,x2:W,y1:0,y2:0,class:'hover',style:'display:none'}));
  spineBand._y=y;
  sp.append(svg, tog);

}
function updateBand(){
  const term=$('#term'); if (!spineBand || !term.clientHeight) return;

function tile(l, v, d, cls=''){ const t=el('div',{class:'tile '+cls}); t.append(el('div',{class:'l'},l), el('div',{class:'v'},v)); if(d) t.append(el('div',{class:'d'+(d.startsWith('!')?' warn':'')}, d.replace(/^!/,''))); return t; }
function columns(svg, series, opts){
  const ns='http://www.w3.org/2000/svg'; const mk=(t,a)=>{const e=document.createElementNS(ns,t); for(const[k,v] of Object.entries(a)) e.setAttribute(k,v); return e;};
  svg.innerHTML=''; const W=svg.clientWidth||600, H=190, padL=60, padB=18, padT=22; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const n=series[0].values.length; if(!n) return; const totals=Array.from({length:n},(_,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0)); const max=Math.max(1,...totals);
  const slot=(W-padL-6)/n; const bw=Math.min(24, Math.max(2, slot-2));
  const ticks=opts.ticks? opts.ticks(max) : niceTicks(max,4); for (const t of ticks){ const y=padT+(H-padT-padB)*(1-t/max); svg.append(mk('line',{x1:padL,x2:W-4,y1:y,y2:y,class:'grid'})); const tx=mk('text',{x:padL-6,y:y+4,'text-anchor':'end'}); tx.textContent=opts.fmt(t); svg.append(tx); }
  for (let i=0;i<n;i++){ let y0=H-padB; const x=padL+i*slot+(slot-bw)/2;
    series.forEach((s,si)=>{ const v=s.values[i]||0; if(!v) return; const h=(H-padT-padB)*v/max; const r=mk('rect',{x,y:y0-h,width:bw,height:Math.max(0,h-2),fill:s.color,class:'bar',rx: si===series.length-1?3:0}); r.addEventListener('mouseenter',e=>showTip(e, opts.tip(i,si))); r.addEventListener('mousemove',moveTip); r.addEventListener('mouseleave',hideTip); if (opts.click) r.addEventListener('click',()=>opts.click(i,si)); svg.append(r); y0-=h; });
    if (opts.xlabel && slot>=(opts.xw||26) && (n<=16 || i%Math.ceil(n/12)===0)){ const tx=mk('text',{x:x+bw/2,y:H-4,'text-anchor':'middle'}); tx.textContent=opts.xlabel(i); svg.append(tx); }
  }
  const mi=totals.indexOf(Math.max(...totals)); if (mi>=0){ const x=padL+mi*slot+slot/2; const y=padT+(H-padT-padB)*(1-totals[mi]/max)-4; const tx=mk('text',{x,y,'text-anchor':'middle',fill:'var(--ink)'}); tx.textContent=opts.fmt(totals[mi]); svg.append(tx); }
}
function timeTicks(maxS){ const steps=[15,30,60,120,300,600,900,1800,3600,7200,14400]; const s=steps.find(v=>v>=maxS/4)||14400; const out=[]; for(let v=0; v<=maxS; v+=s) out.push(v); return out; }
function niceTicks(max,n){ const raw=max/n; const p=Math.pow(10,Math.floor(Math.log10(raw))); const s=[1,2,2.5,5,10].map(m=>m*p).find(v=>v>=raw); const out=[]; for(let v=0; v<=max; v+=s) out.push(v); return out; }
function legend(items){ const l=el('div',{class:'lg'}); for (const [c,n] of items) l.append(el('span',{html:`<i style="background:${c}"></i>${esc(n)}`})); return l; }
function spark(values){
  const W=84,H=20,p=2; const max=Math.max(1,...values); const n=values.length;
  const pts=values.map((v,i)=>[p+i*(W-2*p)/(n-1), H-p-(v/max)*(H-2*p)]);
  const ns='http://www.w3.org/2000/svg'; const s=document.createElementNS(ns,'svg'); s.setAttribute('class','spark'); s.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const pl=document.createElementNS(ns,'polyline'); pl.setAttribute('points',pts.map(q=>q.join(',')).join(' ')); s.append(pl);
  const cur=document.createElementNS(ns,'polyline'); cur.setAttribute('class','cur'); cur.setAttribute('points',pts.slice(-2).map(q=>q.join(',')).join(' ')); s.append(cur);
  const c=document.createElementNS(ns,'circle'); c.setAttribute('cx',pts[n-1][0]); c.setAttribute('cy',pts[n-1][1]); c.setAttribute('r',2.5); s.append(c);
  return s;
}

// ---------------------------------------------------------------- nav
function show(name){
  currentView='v-'+name;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+name));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===name || (DRILL.has(name) && b.dataset.v==='traces')));
  $('#shead').hidden = !DRILL.has(name);$('#archive-filters').hidden=DRILL.has(name);
  document.querySelectorAll('.subnav button').forEach(b=>b.classList.toggle('on', b.dataset.v===name));
  if (!built[name]){ built[name]=true; ({stats:statsView, traces:tracesView, transcript:transcriptView, timeline:()=>{drawTimeline(); timelineRight();}, sstats:sessionStatsView})[name](); }
  else if (name==='timeline') drawTimeline();
  placeStatus();
  if (name==='transcript') requestAnimationFrame(()=>{ anchors=null; drawSpine(); onTermScroll(); });
  location.hash = name==='transcript' && location.hash.startsWith('#t-') ? location.hash : '#'+name;
  if(!archivePending&&((name==='traces'&&!DATA.listTiming)||(name==='stats'&&!DATA.stats)))refreshArchive(name);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.v));
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT' || e.target.tagName==='SELECT') return;
  if (currentView==='v-transcript'){
    if (e.key==='}'||e.key==='{'){ const term=$('#term'); const tops=S.turns.map(t=>$('#t-'+t.uuid).offsetTop-20); const i = e.key==='}' ? tops.findIndex(y=>y>term.scrollTop+4) : tops.filter(y=>y<term.scrollTop-4).length-1; if (i>=0 && i<tops.length) term.scrollTop=tops[i]; }
    if (e.key==='m') toggleSpine();
    if (e.key==='t') toggleTools();
    if (e.key==='o'){ const any=[...document.querySelectorAll('#term .res')].some(r=>!r.classList.contains('open')); document.querySelectorAll('#term .res').forEach(r=>{ if (r.classList.contains('open')!==any) r.click(); }); }
  }
  if ((currentView==='v-transcript'||currentView==='v-timeline') && e.key==='c' && !e.metaKey && !e.ctrlKey) toggleCompress();
  if (currentView==='v-timeline'){ if (e.key==='w') zoomBy(.6); if (e.key==='s') zoomBy(1/.6); if (e.key==='a') panBy(-.2); if (e.key==='d') panBy(.2); if (e.key==='f') {view=[T0,T1];drawTimeline();} }
});

function applyTheme(t){
  const r=document.documentElement; if (t==='auto') r.removeAttribute('data-theme'); else r.dataset.theme=t;
  const dark = t==='dark' || (t==='auto' && darkMQ.matches);
  if (dark) r.dataset.appearance='dark'; else r.removeAttribute('data-appearance');
  $('#theme').title = (dark?'Dark':'Light')+(t==='auto'?' (following the system)':'')+' · switch to '+(dark?'light':'dark');
}
$('#theme').onclick=()=>{
  themeNow = document.documentElement.dataset.appearance==='dark' ? 'light' : 'dark';
  try { localStorage.setItem('kit.theme', themeNow); } catch(e){}
  applyTheme(themeNow);
};
darkMQ.addEventListener?.('change', ()=>{ if (themeNow==='auto') applyTheme('auto'); });
applyTheme(themeNow);
header(); rangeBar();renderFilterBar();
function route(){ const h=location.hash.slice(1); if (h.startsWith('t-')){ show('transcript'); requestAnimationFrame(()=>jumpTo(h.slice(2))); } else if (h==='eval') show('transcript'); else show(['stats','traces','transcript','timeline','sstats'].includes(h)?h:'stats'); }
window.addEventListener('hashchange', ()=>{ if ('#'+currentView.slice(2)!==location.hash) route(); });
route();
window.addEventListener('popstate',()=>{if(new URLSearchParams(location.search).toString()!==params.toString())location.reload();});
})();
</script>
