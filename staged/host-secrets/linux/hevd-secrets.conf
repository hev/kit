# Staged drop-in: ~/.config/systemd/user/hevd.service.d/secrets.conf
# Names the service-account token file hevd reads at use time, so its
# secrets endpoint serves this account. Never put the token itself here.
# kit defaults to this path already; the line makes it explicit and lets a
# host point elsewhere.
[Unit]
Wants=hev-secrets.service
After=hev-secrets.service

[Service]
Environment=HEV_OP_TOKEN_FILE=%h/.config/op/token
