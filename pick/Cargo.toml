[package]
name = "hev-pick"
version = "0.1.0"
edition = "2024"
description = "Fast workspace-aware tmux picker with the familiar fzf UI"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
