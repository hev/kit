# Cut a release: macOS/Linux tarballs and a Windows zip on the GitHub release, the dashboard image on
# Docker Hub, and the Homebrew formula in hev/homebrew-tap.
#
# Started by Adam publishing the draft release (docs/runbooks/release-train.md).
# Publishing is the human decision: it creates the tag vX.Y.Z at the commit the
# draft targets, and the `release: published` event starts this run. A release
# is not cut by pushing a tag any more: a tag created by publishing a release
# is not documented to fire `push: tags`, while `release: published` is the
# documented event for exactly this act, and it is Adam's (not GITHUB_TOKEN's),
# so it starts workflows.
#
# workflow_dispatch re-runs the train for a release that is already published
# (a failed step, a new runner). It refuses a draft or a tag without a release.
#
# After the release is built, shipped and verified, the advance job
# fast-forwards main to the tag (newest release only; never forced) and opens
# the next train branch (scripts/release-advance.py). main is the latest
# published release, so `go install ...@main`, the README and hevkit.com all
# describe released behaviour.
#
# The binary's version picks the dashboard image `hev up` pulls
# (hevlayer/kit:<version>), so the image is pushed before the formula moves:
# a formula that installs a binary whose image does not exist yet is a broken
# `hev up` for everyone who upgrades in between.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to (re)build, vX.Y.Z
        required: true

# Enough to upload assets to and edit a release on this repo, and nothing
# else. Docker Hub and the tap are reached with their own scoped secrets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  release:
    # Edge pre-releases (edge.yml) are not releases. They are created with
    # GITHUB_TOKEN, which starts no workflow, but never build one here.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.check.outputs.newest }}
    steps:
      - name: Check the release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag (vX.Y.Z); nothing to build."
            exit 1
          fi
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$draft" in
            false) ;;
            true) echo "::error::$TAG is still a draft. Publishing it is Adam's step."; exit 1 ;;
            *) echo "::error::No release for $TAG. Releases start from the draft (docs/runbooks/release-train.md)."; exit 1 ;;
          esac
          # Only the newest release moves :latest. A patch on an older line
          # (v0.6.3 after v0.7.0) must not.
          newest="$(gh api --paginate --jq '.[] | select(.draft | not) | .tag_name' "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ "$newest" = "$TAG" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else echo "newest=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # the merge log, for the published notes

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

      # Cross-compiled from Linux, which Go does for darwin without comment as
      # long as cgo is off. modernc sqlite is pure Go.
      - name: Build
        run: GITHUB_REF_NAME="$TAG" ./.github/build-release.sh

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the dashboard image
        env:
          NEWEST: ${{ steps.check.outputs.newest }}
        run: |
          version="${TAG#v}"
          tags=(-t "hevlayer/kit:$version")
          [ "$NEWEST" = true ] && tags+=(-t hevlayer/kit:latest)
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" \
            "${tags[@]}" \
            --push .

      # The release already exists: Adam published it. Attach the assets
      # (--clobber makes a re-run replace them) and swap the draft's private
      # docs-preview section for hevkit.com links. Everything above that
      # section is the notes Adam read, re-rendered from the same commit.
      - name: Attach assets and finalize the notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          python3 scripts/release-draft.py --ref "$TAG" --version "${TAG#v}" --published > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      # Last, and separately: a failure here leaves a good release that the tap
      # has not caught up to yet, which is re-runnable. The reverse order would
      # leave the formula pointing at assets nobody can download. A patch on an
      # older line does not move the formula.
      - name: Bump the tap
        if: steps.check.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: GITHUB_REF_NAME="$TAG" ./.github/bump-tap.sh

  # Report what a user would get. Read-only; re-run it alone with
  #   python3 scripts/release-check.py verify X.Y.Z
  verify:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Verify the release
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ needs.release.outputs.newest }}
        run: |
          flags=()
          [ "$NEWEST" = true ] || flags+=(--not-latest)
          # Docker Hub and the tap's raw file can lag a minute behind a push.
          sleep 60
          python3 scripts/release-check.py verify "${TAG#v}" "${flags[@]}"

  # main follows releases: fast-forward it to the tag and open the next train
  # branch. Only after verify, so main never names a release that is not
  # whole. A dry run (it prints the pushes) until FOH sets the repository
  # variable KIT_ADVANCE_MAIN=on. Pushing main must satisfy its branch
  # protection (required check: go); the tag commit passed `go` when it was
  # pushed to the train branch, so the check is met. GITHUB_TOKEN can't do it
  # whenever the release changes a file under .github/workflows (it has no
  # workflows permission, and GitHub refuses such a ref update from it), so
  # the job uses the KIT_MAIN_PUSH_TOKEN secret: a fine-grained token on
  # hev/kit with Contents and Workflows read/write, owned by someone who may
  # push to main. It never forces: if main cannot fast-forward, the job fails
  # and FOH reports to Adam.
  advance:
    needs: [release, verify]
    if: needs.release.outputs.newest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          token: ${{ secrets.KIT_MAIN_PUSH_TOKEN || github.token }}
      - name: Fast-forward main and open the next train
        env:
          APPLY: ${{ vars.KIT_ADVANCE_MAIN == 'on' && '--apply' || '' }}
        run: |
          # shellcheck disable=SC2086 # APPLY is empty or one flag
          python3 scripts/release-advance.py "${TAG#v}" $APPLY | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$APPLY" ]; then
            echo "::notice::Dry run: set the repository variable KIT_ADVANCE_MAIN=on, or FOH runs the pushes above by hand."
          fi
