name: ci

on:
  pull_request:
  # Train branches (vX.Y) get the same CI as main: features merge into them,
  # and main is fast-forwarded to a release tag on one of them, so the `go`
  # check main's protection requires must already be green on that commit.
  push:
    branches: [main, "v[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proof:
    name: linux-proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: three timing tests 30x under full-suite load
        run: |
          set +e
          go test -race -count=1 -run XXX ./... >/dev/null
          ( n=0; while [ ! -f proof.done ]; do n=$((n+1)); go test -race -count=1 ./... > suite-$n.log 2>&1; echo "suite $n exit $?"; grep -E -- '--- FAIL|^FAIL' suite-$n.log; done ) &
          loader=$!
          sleep 20
          go test -race -count=30 -v -run '^TestHookBlockedIOFailsOpen$' ./cmd/hev > p1.log 2>&1 & a=$!
          go test -race -count=30 -v -run '^TestHookFailOpenOnHangingAndCrashingHandlers$' ./cmd/hev > p2.log 2>&1 & b=$!
          go test -race -count=30 -v -run '^TestHevdRestartsInsideCooldownCostOneRequest$' ./internal/daemon > p3.log 2>&1 & c=$!
          wait $a; ea=$?; wait $b; eb=$?; wait $c; ec=$?
          touch proof.done; wait $loader
          for f in p1 p2 p3; do echo "== $f"; grep -cE -- '^--- PASS' $f.log; grep -E -- '--- FAIL|^(ok|FAIL)|hung stdin' $f.log | sort | uniq -c | sort -rn | head -40; done
          echo "exits $ea $eb $ec"
          [ $ea = 0 ] && [ $eb = 0 ] && [ $ec = 0 ]
