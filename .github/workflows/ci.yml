name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$out" ]; then
            echo "gofmt would rewrite:"; echo "$out"; exit 1
          fi

      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: native job Windows source cross-compile (not native acceptance)
        run: |
          GOOS=windows GOARCH=amd64 go test -c -o "$RUNNER_TEMP/nativejob-windows-amd64.test.exe" ./pkg/nativejob
          GOOS=windows GOARCH=arm64 go test -c -o "$RUNNER_TEMP/nativejob-windows-arm64.test.exe" ./pkg/nativejob

      - name: eval replay preservation checks
        run: python3 scripts/test-replay-eval-corpus.py

  windows-inventory:
    name: windows-inventory
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build existing unified HEV
        run: go build -o hev-candidate.exe ./cmd/hev
      - name: Native read-only observer and fail-closed platform checks
        run: go test -count=1 -run '^(TestWindows|TestObserve)' ./pkg/nodeinventory ./internal/platformops ./internal/redact ./internal/daemon ./cmd/hev
      - name: Observe actual Windows runtime without daemon startup
        shell: pwsh
        run: |
          $env:HEV_CONFIG = Join-Path $env:RUNNER_TEMP "hev-absent-inventory/config.toml"
          $raw = & ./hev-candidate.exe _resource-observe node
          if ($LASTEXITCODE -ne 0) { throw "node observation failed" }
          $node = $raw | ConvertFrom-Json
          if ($node.platform -ne "windows" -or $node.cores -lt 1) { throw "wrong native observation" }
          foreach ($field in @("health", "capacity", "currentWork", "maintenance")) {
            if ($node.$field.state -ne "Unknown") { throw "unverified authority claim" }
          }
          if (Test-Path $env:HEV_CONFIG) { throw "observer created config" }
          & ./hev-candidate.exe query --help
          if ($LASTEXITCODE -ne 0) { throw "trace command missing" }
